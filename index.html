<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Studio Casse-briques</title>
</head>
<body>
<script>
(async function () {
  const src = 'https://raw.githubusercontent.com/pierreg78-maker/studio_casse_briques/c1772f01fb8e5dd8062af0493baa63136c287614/index.html';
  let html = await (await fetch(src)).text();
  html = html.replace(
    '<button class="btn btnGo"><a href:"https://pierreg78-maker.github.io/studio_casse_briques/studio_murmure.html">Voir un exemple de campagne</a></button>',
    '<a class="btn btnGo" href="https://pierreg78-maker.github.io/studio_casse_briques/studio_murmure.html" style="text-decoration:none;display:block;text-align:center;color:#fff">Voir un exemple de campagne</a>'
  );
  html = html.replace(
    '<button id="back" type="button">Retour<br>accueil</button>',
    '<a id="back" href="https://pierreg78-maker.github.io/studio/" style="text-decoration:none">Retour<br>accueil</a>'
  );
  html = html.replace(
    'document.getElementById("back").onclick=()=>{document.getElementById("studio").scrollIntoView({behavior:"smooth"});};',
    ''
  );
  document.open();
  document.write(html);
  document.close();
})().catch(function (e) {
  document.body.textContent = 'Impossible de charger le studio : ' + e;
});
</script>
</body>
</html>
